[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "flashback"
version = "2.1.0"
description = "Oracle Flashback Database Automation Tool — GUI and CLI for managed flashback and restore operations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
]

# Runtime dependencies: NONE (uses Python stdlib only — tkinter, logging, pathlib, smtplib, subprocess)
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
flashback-cli = "cli:main"
flashback-gui = "gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flashback*"]
